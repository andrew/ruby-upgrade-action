name: "Ruby Upgrade Action"
description: "Automatically upgrade Ruby version in .ruby-version, Gemfile, Dockerfile, and GitHub Actions workflows."
author: "Andrew Nesbitt"
branding:
  icon: "refresh-ccw"
  color: "red"

inputs:
  target-ruby-version:
    description: 'Target Ruby version to upgrade to (e.g., 3.3.0). If not specified, latest stable version will be used'
    required: false
  github-token:
    description: 'GitHub token for creating pull requests'
    required: true
    default: ${{ github.token }}
  branch-name:
    description: 'Name of the branch to create for the upgrade'
    required: false
    default: 'ruby-version-upgrade'
  dockerfile-location:
    description: 'Path to Dockerfile if not in the root'
    required: false
    default: 'Dockerfile'

runs:
  using: composite
  steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        token: ${{ inputs.github-token }}

    - name: Determine target Ruby version
      shell: bash
      run: |
        if [ -n "${{ inputs.target-ruby-version }}" ]; then
          echo "TARGET_RUBY_VERSION=${{ inputs.target-ruby-version }}" >> $GITHUB_ENV
        else
          LATEST_RUBY=$(curl -s https://api.github.com/repos/ruby/ruby/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/' | tr '_' '.')
          echo "TARGET_RUBY_VERSION=$LATEST_RUBY" >> $GITHUB_ENV
        fi

    # Workaround: The ubuntu-latest runner image (20260126.10+) ships a pre-installed Ruby 4.0.1
    # that causes native extension builds and bundler operations to fail. Removing it forces
    # setup-ruby to download a working build from ruby-builder instead.
    # See https://github.com/ruby/rubygems/issues/9284.
    - name: Remove pre-installed Ruby 4.0
      shell: bash
      run: rm -rf /opt/hostedtoolcache/Ruby/4.0*

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.TARGET_RUBY_VERSION }}

    - name: Create upgrade branch
      shell: bash
      run: |
        git checkout -b ${{ inputs.branch-name }}

    - name: Update Ruby versions
      id: check_changes
      shell: ruby {0}
      env:
        TARGET_RUBY_VERSION: ${{ env.TARGET_RUBY_VERSION }}
        DOCKERFILE_LOCATION: ${{ inputs.dockerfile-location }}
      run: |
        files = {
          '.ruby-version' => /\A(\s*)(\S+)/,
          '.tool-versions' => /^(ruby[ \t]+)(\S+)/,
          'Gemfile' => /^(ruby[ \t]+["'])([^"']+)/,
          ENV.fetch('DOCKERFILE_LOCATION') => /(FROM ruby:)([0-9.]+)/
        }
        has_changes = false
        files.each do |path, pattern|
          next unless File.file?(path)

          original = File.read(path)
          updated = original.gsub(pattern) { "#{Regexp.last_match(1)}#{ENV.fetch('TARGET_RUBY_VERSION')}" }
          next if original == updated

          File.write(path, updated)
          has_changes = true
          puts "Updated #{path}"
        end
        File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |file| file.puts "has_changes=#{has_changes}" }

    - name: Update dependencies
      if: steps.check_changes.outputs.has_changes == 'true'
      shell: bash
      run: |
        if [ -f Gemfile ]; then
          gem install bundler --no-document --no-prerelease
          BUNDLER_VERSION=$(ruby -e 'puts Gem::Specification.find_all_by_name("bundler").reject { |spec| spec.version.prerelease? }.map(&:version).max')
          bundle "_${BUNDLER_VERSION}_" update --bundler="$BUNDLER_VERSION"
          bundle "_${BUNDLER_VERSION}_" install
          bundle "_${BUNDLER_VERSION}_" update --ruby
          echo "Updated Gemfile.lock and dependencies"
        fi

    - name: Commit changes
      if: steps.check_changes.outputs.has_changes == 'true'
      shell: bash
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        if git ls-remote --exit-code --heads origin "${{ inputs.branch-name }}"; then
          git push origin --delete "${{ inputs.branch-name }}"
        fi
        git add .
        git commit -m "Update Ruby to version ${{ env.TARGET_RUBY_VERSION }}"
        git push origin ${{ inputs.branch-name }}

    - name: Create Pull Request
      if: steps.check_changes.outputs.has_changes == 'true'
      shell: bash
      run: |
        PR_BODY="This PR updates the Ruby version to ${{ env.TARGET_RUBY_VERSION }}.

        Changes made:
        - Updated .ruby-version file (if present)
        - Updated .tool-versions file (if present)
        - Updated Gemfile ruby version (if present)
        - Updated "${{ inputs.dockerfile-location }}" ruby version (if present)
        - Updated Gemfile.lock dependencies
        - Updated bundler to latest version

        Please review and test before merging.
        
        Powered by [Ruby Upgrade Action](https://github.com/andrew/ruby-upgrade-action/)"
        
        gh pr create \
          --title "Update Ruby to version ${{ env.TARGET_RUBY_VERSION }}" \
          --body "$PR_BODY" \
          --base main \
          --head ${{ inputs.branch-name }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
